name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - name: Unit tests (no database, no network)
        run: cd backend && pytest -q tests/test_classify.py tests/test_geo_math.py

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Build static edition (what Netlify / GitHub Pages serve)
        run: pnpm build:static

  # Full pipeline on a documented pilot geography against a real PostGIS service, then
  # data-validation, API and browser tests on the result. Uses live public sources.
  integration-pilot:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    services:
      db:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: trialgraph, POSTGRES_PASSWORD: trialgraph, POSTGRES_DB: trialgraph }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U trialgraph" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TG_DATABASE_URL: postgresql+psycopg://trialgraph:trialgraph@localhost:5433/trialgraph
      TG_PILOT_STATES: MT,WY,ID
      NEXT_PUBLIC_API_URL: http://localhost:8010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "backend[dev]"
      - name: Cache raw source downloads
        uses: actions/cache@v4
        with: { path: data/raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }
      - name: Run pipeline (pilot geography)
        run: trialgraph all
      - name: Data-validation + API tests
        run: cd backend && pytest -q
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Start API and web, run Playwright
        run: |
          uvicorn trialgraph.api.main:app --app-dir backend --port 8010 &
          cd frontend && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
          pnpm build && (pnpm start &) && npx --yes wait-on http://localhost:3010 http://localhost:8010/api/health
          pnpm test:e2e
