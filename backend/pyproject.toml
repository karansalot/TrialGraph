[project]
name = "trialgraph"
version = "0.1.0"
description = "Oncology clinical trial geographic access intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trialgraph = "trialgraph.pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trialgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: requires a loaded TrialGraph PostGIS database (run the pipeline first)",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E702", "E731", "B008", "B904", "B905"]
